[project]
name = "jarvis"
version = "0.1.0"
description = "Read-only multi-agent trade-signal system"
requires-python = ">=3.11"
dependencies = [
	"langgraph>=1.2.12",
	"langchain-anthropic>=1.7.5",
	"pydantic>=2.13.5",
	"pydantic-settings>=2.15.0",
	"PyYAML>=6.0.3",
	"pandas>=3.0.6",
	"pyarrow>=20.0.0",
	"numpy>=2.4.3",
	"ta>=0.11.0",
	"MetaTrader5>=5.0.6231; sys_platform == 'win32'",
	"timesfm[torch]>=3.0.2",
	"torch>=2.14.1",
	"feedparser>=6.0.14",
	"httpx>=0.28.1",
	"sqlmodel>=0.0.47",
	"APScheduler>=3.11.3",
	"fastapi>=0.142.2",
	"uvicorn>=0.54.0",
	"structlog>=26.1.0",
]

[dependency-groups]
dev = [
	"mypy>=2.3.1",
	"pytest>=9.1.1",
	"pytest-cov>=7.1.0",
	"ruff>=0.16.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src/jarvis"]
