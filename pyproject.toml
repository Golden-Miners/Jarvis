[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis"
version = "0.1.0"
description = "Read-only multi-agent trade-signal system"
requires-python = ">=3.11"
dependencies = [
	"langgraph>=1.2.12",
	"langchain-anthropic>=1.7.5",
	"pydantic>=2.13.5",
	"pydantic-settings>=2.15.0",
	"PyYAML>=6.0.3",
	"pandas>=3.0.6",
	"pyarrow>=20.0.0",
	"numpy>=2.4.3",
	"ta>=0.11.0",
	"MetaTrader5>=5.0.6231; sys_platform == 'win32'",
	"timesfm[torch]>=3.0.2",
	"torch>=2.14.1",
	"feedparser>=6.0.14",
	"httpx>=0.28.1",
	"sqlmodel>=0.0.47",
	"APScheduler>=3.11.3",
	"fastapi>=0.142.2",
	"uvicorn>=0.54.0",
	"structlog>=26.1.0",
	"ml-dtypes>=0.6.0",
	"alembic>=1.20.0",
	"python-jose[cryptography]>=3.3.0",
	"passlib[bcrypt]>=1.7.4",
	"python-multipart>=0.0.9",
	"sse-starlette>=2.1.0",
	"bcrypt==4.2.1",
	"argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
	"mypy>=2.3.1",
	"pytest>=9.1.1",
	"pytest-cov>=7.1.0",
	"pytest-randomly>=5.0.0",
	"pytest-timeout>=2.3.1",
	"ruff>=0.16.9",
	"types-passlib>=1.7.7.20260211",
	"types-python-jose>=3.5.0.20260408",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --timeout=60"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')"
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
exclude = ["alembic/versions/", "scripts/"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
files = ["src/jarvis"]

[project.scripts]
jarvis-api = "jarvis.api.main:app"
jarvis = "jarvis.cli:main"
